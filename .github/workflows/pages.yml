name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          # publish every page, so new pages are never forgotten
          cp ./*.html _site/
          cp -r css js icons _site/
          cp sw.js manifest.webmanifest _site/
          # fail the build if any page referenced from the app is missing
          missing=0
          for ref in $(grep -rhoE "[a-z0-9-]+\.html" ./*.html js | sort -u); do
            [ -f "_site/$ref" ] || { echo "::error::$ref is linked but missing from the site"; missing=1; }
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
